name: Auto-merge relay PRs

# Automatically merges pull requests opened by the relay's scheduled runs.
# Safety: only acts on PRs whose head branch lives in THIS repo and is named
# claude/* (external contributors come from forks and cannot push such branches),
# and only after required checks pass. It never merges forked or human PRs.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Head branch must be in this repo (not a fork) and named claude/*
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    steps:
      - name: Wait for the deploy check to pass
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            // Poll the combined check-runs on the head sha for up to ~5 minutes.
            for (let i = 0; i < 30; i++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const runs = data.check_runs.filter(r => r.name !== 'auto-merge');
              const relevant = runs.filter(r => r.name.toLowerCase().includes('deploy') || r.name.toLowerCase().includes('build'));
              // If there are no build/deploy checks at all (e.g. journal-only change), allow merge.
              if (relevant.length === 0) return;
              const allDone = relevant.every(r => r.status === 'completed');
              const anyFail = relevant.some(r => ['failure','cancelled','timed_out'].includes(r.conclusion));
              if (anyFail) { core.setFailed('A required check failed; not merging.'); return; }
              if (allDone) return;
              await new Promise(r => setTimeout(r, 10000));
            }
            core.setFailed('Timed out waiting for checks.');
      - name: Merge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
            });
